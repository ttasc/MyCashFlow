<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyCashFlow</title>
  <style>
    /* =========================================
       SUCKLESS & WATER-THEME CSS
       ========================================= */
    :root {
      --bg: #F0F4F8;
      --surface: #FFFFFF;
      --text-main: #102A43;
      --text-muted: #627D98;
      --primary: #0077B6;
      --primary-fade: #E0F2FE;
      --green: #059669;
      --red: #E11D48;
      --border: #D9E2EC;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(0, 119, 182, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

    body { background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding-bottom: 90px; }

    .app { max-width: 500px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; }

    header { padding: 25px 20px 15px; text-align: center; }
    h1 { font-size: 1.4rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }

    .view { display: none; padding: 0 20px 20px; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .view.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Main Navigation */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px); display: flex; justify-content: space-around;
      padding: 10px 15px 25px; border-top: 1px solid var(--border); z-index: 10;
      max-width: 500px; margin: 0 auto; border-radius: 10px;
    }
    nav button {
      flex: 1; margin: 0 5px; padding: 12px 0; border: none; background: transparent;
      color: var(--text-muted); font-size: 0.9rem; font-weight: 600; border-radius: 12px;
      cursor: pointer; transition: 0.2s ease;
    }
    nav button.active { background: var(--primary-fade); color: var(--primary); }

    .card { background: var(--surface); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.5); }
    .card h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; font-weight: 600; }

    .hero { text-align: center; background: linear-gradient(135deg, var(--primary) 0%, #00B4D8 100%); color: white; border: none; }
    .hero h3 { color: rgba(255,255,255,0.8); margin-bottom: 4px; }
    .hero .value { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; margin: 5px 0; }
    .hero .sub-value { font-size: 1rem; color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.1); padding: 5px 12px; border-radius: 20px; display: inline-block; }
    .hero .val-red { color: #FFA8B6 !important; }

    .value { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
    .val-green { color: var(--green); }
    .val-red { color: var(--red); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* =========================================
       SEGMENTED CONTROL (Thanh Tab Nợ)
       ========================================= */
    .segment-control {
      display: flex; background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 16px;
    }
    .segment-btn {
      flex: 1; border: none; background: transparent; padding: 10px 4px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer;
      transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .segment-btn span { font-size: 0.75rem; font-weight: 700; } /* Phần hiển thị số tiền tổng trên Tab */
    .segment-btn.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    .debt-tab-content { display: none; animation: fadeIn 0.3s; }
    .debt-tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Debt Layout Fixed */
    .debt-list { display: flex; flex-direction: column; gap: 10px; }
    .debt-item {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 12px; background: var(--bg); border-radius: 10px; gap: 12px;
    }
    .debt-name {
      flex: 1; font-size: 0.95rem; font-weight: 500; word-break: break-word; line-height: 1.4; color: var(--text-main);
    }
    .debt-amount {
      flex-shrink: 0; white-space: nowrap; font-weight: 700; font-size: 1rem;
    }

    /* Forms & Utilities */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid transparent;
      color: var(--text-main); border-radius: 12px; font-size: 1rem; outline: none; transition: 0.2s; appearance: none;
    }
    input:focus, select:focus { background: var(--surface); border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-fade); }
    select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23627D98' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; }

    .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 16px 0; padding: 12px 16px; background: var(--primary-fade); border-radius: 12px; cursor: pointer; }
    .checkbox-group input { width: 20px; height: 20px; accent-color: var(--primary); }
    .checkbox-group label { margin: 0; font-size: 0.95rem; cursor: pointer; color: var(--primary); }

    #savings-section { padding: 16px; border: 1px dashed var(--primary); border-radius: 12px; margin-bottom: 16px; background: var(--surface); }

    .btn-submit {
      width: 100%; padding: 16px; background: var(--primary); color: white; border: none;
      border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 12px rgba(0, 119, 182, 0.3); margin-top: 8px;
    }
    .btn-submit:active { transform: scale(0.98); background: #005F92; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .loading { text-align: center; color: var(--primary); font-weight: 500; margin-top: 40px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
<div class="app">

  <header>
    <h1>MyCashFlow</h1>
  </header>

  <!-- DASHBOARD VIEW -->
  <main id="view-dash" class="view active">
    <div id="dash-loading" class="loading">Đang đồng bộ dòng chảy...</div>
    <div id="dash-content" style="display: none;">

      <div class="card hero">
        <h3>Tổng tài sản</h3>
        <div class="value" id="val-total-bal">0</div>
        <div class="sub-value">Tiết kiệm: <span id="val-total-sav">0</span></div>
      </div>

      <div class="card">
        <h3>Tháng hiện tại (<span id="val-month">--</span>)</h3>
        <div class="grid-2">
          <div style="background: var(--bg); padding: 12px; border-radius: 10px;">
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Tổng Thu</div>
            <div class="value val-green" id="val-m-income" style="word-break: break-all;">0</div>
          </div>
          <div style="background: var(--bg); padding: 12px; border-radius: 10px;">
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Tổng Chi</div>
            <div class="value val-red" id="val-m-expense" style="word-break: break-all;">0</div>
          </div>
        </div>
        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
          <span style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted); white-space: nowrap;">Dư trong tháng</span>
          <span class="value" id="val-m-balance" style="font-size: 1.2rem; text-align: right; word-break: break-word;">0</span>
        </div>
      </div>

      <!-- SỔ NỢ (Segmented Tab Layout) -->
      <div class="card" style="padding: 16px;">
        <!-- Thanh Tab -->
        <div class="segment-control">
          <button class="segment-btn active" onclick="switchDebtTab('owe-me')" id="seg-btn-owe-me">
            Người ta nợ <span id="seg-val-owe-me" class="val-green">0</span>
          </button>
          <button class="segment-btn" onclick="switchDebtTab('i-owe')" id="seg-btn-i-owe">
            Mình nợ <span id="seg-val-i-owe" class="val-red">0</span>
          </button>
        </div>

        <!-- Nội dung Tab: Người ta nợ -->
        <div id="tab-owe-me" class="debt-tab-content active">
          <div class="debt-list" id="list-owe-me"></div>
        </div>

        <!-- Nội dung Tab: Mình nợ -->
        <div id="tab-i-owe" class="debt-tab-content">
          <div class="debt-list" id="list-i-owe"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- TRANSACTION VIEW -->
  <main id="view-tx" class="view">
    <div class="card">
      <div class="form-group">
        <label>Loại giao dịch</label>
        <select id="tx-type">
          <option value="Expense">Chi tiền (Dòng tiền ra)</option>
          <option value="Income">Thu nhập (Dòng tiền vào)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Số tiền (VNĐ)</label>
        <input type="number" id="tx-amount" placeholder="0" required inputmode="numeric">
      </div>
      <div class="form-group">
        <label>Hạng mục</label>
        <input type="text" id="tx-category" placeholder="Ví dụ: Ăn uống, Lương..." list="cat-list">
        <datalist id="cat-list">
          <option value="Lương"></option>
          <option value="Ăn uống"></option>
          <option value="Di chuyển"></option>
          <option value="Sinh hoạt"></option>
        </datalist>
      </div>

      <label class="checkbox-group" id="chk-save-group" style="display: none;">
        <input type="checkbox" id="tx-is-saving" checked>
        <span>Trích ra tiết kiệm</span>
      </label>

      <div id="savings-section" style="display: none;">
        <div class="grid-2">
          <div class="form-group" style="margin:0;">
            <label>Hình thức</label>
            <select id="tx-save-type">
              <option value="percent">Tỉ lệ (%)</option>
              <option value="fixed">Cố định</option>
            </select>
          </div>
          <div class="form-group" style="margin:0;">
            <label>Mức trích</label>
            <input type="number" id="tx-save-val" value="100" inputmode="numeric">
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 0;">
        <label>Ghi chú thêm</label>
        <input type="text" id="tx-note" placeholder="Chi tiết...">
      </div>
    </div>
    <button class="btn-submit" onclick="submitTx()" id="btn-tx">Ghi Nhận Giao Dịch</button>
  </main>

  <!-- DEBT VIEW -->
  <main id="view-debt" class="view">
    <div class="card">
      <div class="form-group">
        <label>Hành động</label>
        <select id="debt-action">
          <option value="Lend">Cho vay (Dòng tiền ra)</option>
          <option value="Borrow">Đi vay (Dòng tiền vào)</option>
          <option value="Collect">Thu nợ (Dòng tiền vào)</option>
          <option value="Repay">Trả nợ (Dòng tiền ra)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Số tiền (VNĐ)</label>
        <input type="number" id="debt-amount" placeholder="0" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>Đối tượng</label>
        <input type="text" id="debt-person-input" placeholder="Nhập tên người...">
        <select id="debt-person-select" style="display: none;"></select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label>Ghi chú thêm</label>
        <input type="text" id="debt-note" placeholder="Chi tiết...">
      </div>
    </div>
    <button class="btn-submit" onclick="submitDebt()" id="btn-debt">Cập Nhật Công Nợ</button>
  </main>

  <!-- NAV -->
  <nav>
    <button class="active" onclick="switchTab('dash')" id="tab-dash">Tổng quan</button>
    <button onclick="switchTab('tx')" id="tab-tx">Thu / Chi</button>
    <button onclick="switchTab('debt')" id="tab-debt">Vay / Nợ</button>
  </nav>

</div>

  <script>
    const fmt = (num) => new Intl.NumberFormat('vi-VN').format(num || 0);
    let activeDebtsState = {};

    /* LOGIC CHUYỂN TAB CHÍNH */
    function switchTab(tab) {
      document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(e => e.classList.remove('active'));
      document.getElementById(`view-${tab}`).classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
      if (tab === 'dash') loadDashboard();
    }

    /* LOGIC CHUYỂN TAB CÔNG NỢ (MỚI) */
    function switchDebtTab(tab) {
      document.querySelectorAll('.segment-btn').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.debt-tab-content').forEach(e => e.classList.remove('active'));

      document.getElementById(`seg-btn-${tab}`).classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
    }

    /* LOGIC ẨN/HIỆN TIẾT KIỆM */
    const txType = document.getElementById('tx-type');
    const chkSaveGroup = document.getElementById('chk-save-group');
    const saveSection = document.getElementById('savings-section');
    const txIsSaving = document.getElementById('tx-is-saving');

    txType.addEventListener('change', (e) => {
      const isIncome = e.target.value === 'Income';
      chkSaveGroup.style.display = isIncome ? 'flex' : 'none';
      saveSection.style.display = (isIncome && txIsSaving.checked) ? 'block' : 'none';
    });

    txIsSaving.addEventListener('change', (e) => {
      saveSection.style.display = e.target.checked ? 'block' : 'none';
    });

    /* LOGIC ĐỔI INPUT CÔNG NỢ */
    const debtAction = document.getElementById('debt-action');
    const debtPersonInput = document.getElementById('debt-person-input');
    const debtPersonSelect = document.getElementById('debt-person-select');

    debtAction.addEventListener('change', (e) => {
      const action = e.target.value;
      if (action === 'Lend' || action === 'Borrow') {
        debtPersonInput.style.display = 'block';
        debtPersonSelect.style.display = 'none';
      } else {
        debtPersonInput.style.display = 'none';
        debtPersonSelect.style.display = 'block';
        debtPersonSelect.innerHTML = '<option value="">-- Chọn đối tượng --</option>';
        for (const [person, data] of Object.entries(activeDebtsState)) {
          if (action === 'Collect' && data.oweMe > 0) debtPersonSelect.innerHTML += `<option value="${person}">${person} (Đang nợ: ${fmt(data.oweMe)})</option>`;
          if (action === 'Repay' && data.iOwe > 0) debtPersonSelect.innerHTML += `<option value="${person}">${person} (Mình nợ: ${fmt(data.iOwe)})</option>`;
        }
      }
    });

    function processDebts(rawData) {
      const db = {};
      rawData.forEach(row => {
        const [, action, amount, person] = row;
        if(!person) return;
        if(!db[person]) db[person] = { oweMe: 0, iOwe: 0 };
        if(action === 'Lend') db[person].oweMe += amount;
        if(action === 'Collect') db[person].oweMe -= amount;
        if(action === 'Borrow') db[person].iOwe += amount;
        if(action === 'Repay') db[person].iOwe -= amount;
      });
      return db;
    }

    function loadDashboard() {
      document.getElementById('dash-loading').style.display = 'block';
      document.getElementById('dash-content').style.display = 'none';

      // Giả lập cho môi trường Test ngoài AppScript
      if(typeof google === 'undefined') {
         window.google = { script: { run: { withSuccessHandler: function(cb){
            setTimeout(() => cb({
                metrics: { currentMonth: "09/2026", monthlyIncome: 9000000, monthlyExpense: 400000, monthlyBalance: 903150000, totalBalance: 1500000000, totalSavings: 20000000 },
                debts: [
                  ["","Lend", 100000000, "Lê Nguyễn Thị Đoan Thùy Nguyễn Lê Đoan"],
                  ["","Lend", 1000000, "HEHE"],
                  ["","Borrow", 1000000000, "Ông chú Viettel đòi nợ cuối tháng"],
                  ["","Borrow", 500000, "Bà bán phở đầu ngõ"]
                ]
            }), 300); return this; }, getDashboardData: function(){}, submitTransaction: function(){}, submitDebt: function(){} } } };
      }

      google.script.run.withSuccessHandler(res => {
        const m = res.metrics;
        document.getElementById('val-month').innerText = m.currentMonth;
        document.getElementById('val-m-income').innerText = fmt(m.monthlyIncome);
        document.getElementById('val-m-expense').innerText = fmt(m.monthlyExpense);

        const mBal = document.getElementById('val-m-balance');
        mBal.innerText = fmt(m.monthlyBalance);
        mBal.className = 'value ' + (m.monthlyBalance < 0 ? 'val-red' : 'val-green');

        const tBal = document.getElementById('val-total-bal');
        tBal.innerText = fmt(m.totalBalance);
        tBal.className = 'value ' + (m.totalBalance < 0 ? 'val-red' : '');

        document.getElementById('val-total-sav').innerText = fmt(m.totalSavings);

        activeDebtsState = processDebts(res.debts);

        let htmlOweMe = '', htmlIOwe = '';
        let totalOweMe = 0, totalIOwe = 0; // Tính tổng tiền hiển thị trên Tab

        for (const [person, data] of Object.entries(activeDebtsState)) {
          if (data.oweMe > 0) {
            htmlOweMe += `<div class="debt-item"><span class="debt-name">${person}</span><span class="debt-amount val-green">${fmt(data.oweMe)}</span></div>`;
            totalOweMe += data.oweMe;
          }
          if (data.iOwe > 0) {
            htmlIOwe += `<div class="debt-item"><span class="debt-name">${person}</span><span class="debt-amount val-red">${fmt(data.iOwe)}</span></div>`;
            totalIOwe += data.iOwe;
          }
        }

        // Gắn danh sách
        document.getElementById('list-owe-me').innerHTML = htmlOweMe || '<div class="debt-item"><span style="color:var(--text-muted)">Không có</span></div>';
        document.getElementById('list-i-owe').innerHTML = htmlIOwe || '<div class="debt-item"><span style="color:var(--text-muted)">Không có</span></div>';

        // Gắn số tiền tổng vào Tab
        document.getElementById('seg-val-owe-me').innerText = totalOweMe > 0 ? fmt(totalOweMe) : '0';
        document.getElementById('seg-val-i-owe').innerText = totalIOwe > 0 ? fmt(totalIOwe) : '0';

        debtAction.dispatchEvent(new Event('change'));

        document.getElementById('dash-loading').style.display = 'none';
        document.getElementById('dash-content').style.display = 'block';
      }).getDashboardData();
    }

    function submitTx() {
      const amount = parseFloat(document.getElementById('tx-amount').value);
      if(!amount) return alert('Vui lòng nhập số tiền');

      const type = txType.value;
      let savings = 0;
      if (type === 'Income' && txIsSaving.checked) {
        const sType = document.getElementById('tx-save-type').value;
        const sVal = parseFloat(document.getElementById('tx-save-val').value) || 0;
        savings = sType === 'percent' ? (amount * sVal / 100) : sVal;
      }

      const payload = { type: type, amount: amount, category: document.getElementById('tx-category').value.trim(), savings: savings, note: document.getElementById('tx-note').value.trim() };
      const btn = document.getElementById('btn-tx');
      btn.innerText = 'Đang ghi...'; btn.disabled = true;

      google.script.run.withSuccessHandler(() => {
        alert('Đã lưu giao dịch!');
        document.getElementById('tx-amount').value = '';
        document.getElementById('tx-category').value = '';
        document.getElementById('tx-note').value = '';
        btn.innerText = 'Ghi Nhận Giao Dịch'; btn.disabled = false;
        loadDashboard();
      }).submitTransaction(payload);
    }

    function submitDebt() {
      const amount = parseFloat(document.getElementById('debt-amount').value);
      const action = document.getElementById('debt-action').value;
      const person = (action === 'Lend' || action === 'Borrow')
        ? document.getElementById('debt-person-input').value.trim() : document.getElementById('debt-person-select').value;

      if(!amount || !person) return alert('Vui lòng nhập số tiền và tên người!');

      const payload = { action: action, amount: amount, person: person, note: document.getElementById('debt-note').value.trim() };
      const btn = document.getElementById('btn-debt');
      btn.innerText = 'Đang ghi...'; btn.disabled = true;

      google.script.run.withSuccessHandler(() => {
        alert('Đã lưu công nợ!');
        document.getElementById('debt-amount').value = '';
        document.getElementById('debt-person-input').value = '';
        document.getElementById('debt-person-select').value = '';
        document.getElementById('debt-note').value = '';
        btn.innerText = 'Cập Nhật Công Nợ'; btn.disabled = false;
        loadDashboard();
      }).submitDebt(payload);
    }

    window.onload = loadDashboard;
  </script>
</body>
</html>
